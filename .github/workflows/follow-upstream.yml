{"name":"Follow upstream taste-skill","on":{"schedule":[{"cron":"17 20 * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"update":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Pin the newest upstream commit","run":"set -euo pipefail\nSHA=$(git ls-remote https://github.com/Leonxlnx/taste-skill HEAD | cut -f1)\nVER=$(curl -fsSL \"https://raw.githubusercontent.com/Leonxlnx/taste-skill/$SHA/.claude-plugin/marketplace.json\" | jq -r '[.plugins[] | select(.name==\"taste-skill\") | .version][0] // \"0.0.0\"')\nNEWVER=\"$VER+g${SHA:0:7}\"\njq --arg sha \"$SHA\" --arg ver \"$NEWVER\" '(.plugins[] | select(.name==\"taste-skill\")) |= (.source.sha=$sha | .version=$ver)' .claude-plugin/marketplace.json > /tmp/m.json\nmv /tmp/m.json .claude-plugin/marketplace.json\nif git diff --quiet; then echo \"Already up to date: $NEWVER\"; exit 0; fi\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898283+github-actions[bot]@users.noreply.github.com\"\ngit commit -am \"Follow upstream taste-skill $NEWVER\"\ngit push"}]}}}
